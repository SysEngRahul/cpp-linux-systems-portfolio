name: Telemetry Engine CI

on:
  push:
    paths:
      - "telemetry-engine/**"
      - ".github/workflows/telemetry-engine-ci.yml"
  pull_request:
    paths:
      - "telemetry-engine/**"
      - ".github/workflows/telemetry-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build-and-test:
    # Pin the OS to avoid ubuntu-latest silently migrating to another Ubuntu release.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t telemetry-engine-ci ./telemetry-engine

      - name: Run test suite in Docker
        run: docker run --rm telemetry-engine-ci
